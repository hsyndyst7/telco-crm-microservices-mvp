server:
  port: 9002

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/db_customer
    username: telco_admin
    password: telco_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true